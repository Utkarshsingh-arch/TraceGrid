services:
  postgres:
    image: postgres:16-alpine
    container_name: tracegrid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracegrid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracegrid_password}
      POSTGRES_DB: ${POSTGRES_DB:-tracegrid_db}
    ports:
      # Localhost-only port binding to protect the development database
      - "127.0.0.1:5432:5432"
    volumes:
      - tracegrid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  tracegrid_pgdata:
    name: tracegrid_pgdata
