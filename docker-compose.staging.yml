# ==============================================================================
# TraceGrid Isolated Staging Environment (Docker Compose)
# Completely isolated from the working development environment.
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#
# Ports:
#   - Web (Nginx + SPA + API proxy): http://127.0.0.1:8080
#   - PostgreSQL (isolated staging): 127.0.0.1:5433
# ==============================================================================

name: tracegrid-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: tracegrid_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_DB_USER:-tracegrid_staging_user}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-tracegrid_staging_password_secure123}
      POSTGRES_DB: ${STAGING_DB_NAME:-tracegrid_staging_db}
    ports:
      # Bound strictly to localhost on alternate port 5433 to prevent dev conflict
      - "127.0.0.1:5433:5432"
    volumes:
      - tracegrid_staging_pgdata:/var/lib/postgresql/data
    networks:
      - tracegrid_staging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tracegrid_staging_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 5000
      API_PREFIX: /api
      CORS_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
      TRUST_PROXY: "true"
      DATABASE_URL: "postgresql://${STAGING_DB_USER:-tracegrid_staging_user}:${STAGING_DB_PASSWORD:-tracegrid_staging_password_secure123}@postgres:5432/${STAGING_DB_NAME:-tracegrid_staging_db}?schema=public"
      JWT_SECRET: ${STAGING_JWT_SECRET:-tracegrid-staging-secret-key-at-least-32chars!}
      JWT_EXPIRES_IN: 8h
      STORAGE_LOCAL_PATH: /app/storage/evidence
      STORAGE_REVOCATION_PATH: /app/storage/revoked_tokens.json
      MAX_FILE_SIZE_BYTES: 10485760
    volumes:
      - tracegrid_staging_storage:/app/storage
    networks:
      - tracegrid_staging_net
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tracegrid_staging_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Bound strictly to localhost on port 8080
      - "127.0.0.1:8080:8080"
    networks:
      - tracegrid_staging_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  tracegrid_staging_net:
    name: tracegrid_staging_net
    driver: bridge

volumes:
  tracegrid_staging_pgdata:
    name: tracegrid_staging_pgdata
  tracegrid_staging_storage:
    name: tracegrid_staging_storage
